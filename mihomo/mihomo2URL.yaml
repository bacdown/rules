# From：https://github.com/qichiyuhub/rule/blob/main/config/mihomo/config/mihomo.yaml 
# 必读！！！
# mihomo当前版本理论上较完美的分流准确同时防泄露专业版本（nikki，openclash等官方内核的都可以跑），如果用不明白，建议使用config.yaml
# 因为DNS流程较多，尽可能用本地搭建DNS开启乐观缓存。
# 因为配置里开启了绕过大陆，google商店会无法更新，可以尝试把 "+.googleapis.cn"  "+.xn--ngstr-lra8j.com" 两个域名后缀指定走国外DNS，同时rules里添加走代理，理论上可以解决，或者关闭绕过大陆。
# 配置文件作为DNS分流工具的远程使用，搭配Nikki仅核心运行，如果要单独使用监听端口修改成53，去掉DNS劫持的注释。
# 多订阅配置文件，适合多订阅精确控制订阅和分流。
# 根据需要修改对应修改锚点订阅名称
rule-anchor:
  P: &P {type: http, interval: 0, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, exclude-filter: "官网|剩余|流量|套餐|订阅|直连|到期时间|GB|Expire Date|Traffic|ExpireDate", proxy: 直连}
  SUB1: &SUB1 SUB1 # 改订阅名称请改这里；对应地区组显示名需同步修改下方名称锚点
  SUB2: &SUB2 SUB2 # 改订阅名称请改这里；对应地区组显示名需同步修改下方名称锚点
  HK_ZD_SUB1: &HK_ZD_SUB1 HK自动SUB1
  HK_ZD_SUB2: &HK_ZD_SUB2 HK自动SUB2
  JP_ZD_SUB1: &JP_ZD_SUB1 JP自动SUB1
  JP_ZD_SUB2: &JP_ZD_SUB2 JP自动SUB2
  TW_ZD_SUB1: &TW_ZD_SUB1 TW自动SUB1
  TW_ZD_SUB2: &TW_ZD_SUB2 TW自动SUB2
  SG_ZD_SUB1: &SG_ZD_SUB1 SG自动SUB1
  SG_ZD_SUB2: &SG_ZD_SUB2 SG自动SUB2
  US_ZD_SUB1: &US_ZD_SUB1 US自动SUB1
  US_ZD_SUB2: &US_ZD_SUB2 US自动SUB2
  HK_FB_SUB1: &HK_FB_SUB1 HK故转SUB1
  HK_FB_SUB2: &HK_FB_SUB2 HK故转SUB2
  JP_FB_SUB1: &JP_FB_SUB1 JP故转SUB1
  JP_FB_SUB2: &JP_FB_SUB2 JP故转SUB2
  TW_FB_SUB1: &TW_FB_SUB1 TW故转SUB1
  TW_FB_SUB2: &TW_FB_SUB2 TW故转SUB2
  SG_FB_SUB1: &SG_FB_SUB1 SG故转SUB1
  SG_FB_SUB2: &SG_FB_SUB2 SG故转SUB2
  US_FB_SUB1: &US_FB_SUB1 US故转SUB1
  US_FB_SUB2: &US_FB_SUB2 US故转SUB2
  HK_SD_SUB1: &HK_SD_SUB1 HK手动SUB1
  HK_SD_SUB2: &HK_SD_SUB2 HK手动SUB2
  JP_SD_SUB1: &JP_SD_SUB1 JP手动SUB1
  JP_SD_SUB2: &JP_SD_SUB2 JP手动SUB2
  TW_SD_SUB1: &TW_SD_SUB1 TW手动SUB1
  TW_SD_SUB2: &TW_SD_SUB2 TW手动SUB2
  SG_SD_SUB1: &SG_SD_SUB1 SG手动SUB1
  SG_SD_SUB2: &SG_SD_SUB2 SG手动SUB2
  US_SD_SUB1: &US_SD_SUB1 US手动SUB1
  US_SD_SUB2: &US_SD_SUB2 US手动SUB2
  ALL_ZD: &ALL_ZD 全部自动
  ALL_SD: &ALL_SD 全部手动
  # 节点选择
  G1: &G1 {type: select, proxies: [默认代理, *HK_ZD_SUB1, *HK_ZD_SUB2, *JP_ZD_SUB1, *JP_ZD_SUB2, *TW_ZD_SUB1, *TW_ZD_SUB2, *SG_ZD_SUB1, *SG_ZD_SUB2, *US_ZD_SUB1, *US_ZD_SUB2, *HK_FB_SUB1, *HK_FB_SUB2, *JP_FB_SUB1, *JP_FB_SUB2, *TW_FB_SUB1, *TW_FB_SUB2, *SG_FB_SUB1, *SG_FB_SUB2, *US_FB_SUB1, *US_FB_SUB2, *HK_SD_SUB1, *HK_SD_SUB2, *JP_SD_SUB1, *JP_SD_SUB2, *TW_SD_SUB1, *TW_SD_SUB2, *SG_SD_SUB1, *SG_SD_SUB2, *US_SD_SUB1, *US_SD_SUB2, *ALL_ZD, *ALL_SD, 直连]}
  S1: &S1 {type: select, proxies: [*HK_ZD_SUB1, *HK_ZD_SUB2, *JP_ZD_SUB1, *JP_ZD_SUB2, *SG_ZD_SUB1, *SG_ZD_SUB2, *TW_ZD_SUB1, *TW_ZD_SUB2, *US_ZD_SUB1, *US_ZD_SUB2, *HK_FB_SUB1, *HK_FB_SUB2, *JP_FB_SUB1, *JP_FB_SUB2, *SG_FB_SUB1, *SG_FB_SUB2, *TW_FB_SUB1, *TW_FB_SUB2, *US_FB_SUB1, *US_FB_SUB2, *HK_SD_SUB1, *HK_SD_SUB2, *JP_SD_SUB1, *JP_SD_SUB2, *SG_SD_SUB1, *SG_SD_SUB2, *TW_SD_SUB1, *TW_SD_SUB2, *US_SD_SUB1, *US_SD_SUB2, *ALL_ZD, *ALL_SD, 直连]}
  S2: &S2 {type: select, proxies: [*JP_ZD_SUB1, *JP_ZD_SUB2, *SG_ZD_SUB1, *SG_ZD_SUB2, *TW_ZD_SUB1, *TW_ZD_SUB2, *HK_ZD_SUB1, *HK_ZD_SUB2, *US_ZD_SUB1, *US_ZD_SUB2, *JP_FB_SUB1, *JP_FB_SUB2, *SG_FB_SUB1, *SG_FB_SUB2, *TW_FB_SUB1, *TW_FB_SUB2, *HK_FB_SUB1, *HK_FB_SUB2, *US_FB_SUB1, *US_FB_SUB2, *JP_SD_SUB1, *JP_SD_SUB2, *SG_SD_SUB1, *SG_SD_SUB2, *TW_SD_SUB1, *TW_SD_SUB2, *HK_SD_SUB1, *HK_SD_SUB2, *US_SD_SUB1, *US_SD_SUB2, *ALL_ZD, *ALL_SD, 直连]}
  S3: &S3 {type: select, proxies: [*US_ZD_SUB1, *US_ZD_SUB2, *JP_ZD_SUB1, *JP_ZD_SUB2, *SG_ZD_SUB1, *SG_ZD_SUB2, *TW_ZD_SUB1, *TW_ZD_SUB2, *HK_ZD_SUB1, *HK_ZD_SUB2, *US_FB_SUB1, *US_FB_SUB2, *JP_FB_SUB1, *JP_FB_SUB2, *SG_FB_SUB1, *SG_FB_SUB2, *TW_FB_SUB1, *TW_FB_SUB2, *HK_FB_SUB1, *HK_FB_SUB2, *US_SD_SUB1, *US_SD_SUB2, *JP_SD_SUB1, *JP_SD_SUB2, *SG_SD_SUB1, *SG_SD_SUB2, *TW_SD_SUB1, *TW_SD_SUB2, *HK_SD_SUB1, *HK_SD_SUB2, *ALL_ZD, *ALL_SD, 直连]}
  S5: &S5 {type: url-test, proxies: [直连, DIRECT], interval: 3600, lazy: true, url: "http://connect.rom.miui.com/generate_204"}
  # 节点筛选
  HK: &HK "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"
  JP: &JP "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"
  TW: &TW "(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$"
  SG: &SG "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$"
  US: &US "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"
  Exclude: &Exclude "^((?!(官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$"
  # 策略组
  SD: &SD {type: select, include-all: true}
  SD1: &SD1 {type: select, use: [*SUB1]}
  SD2: &SD2 {type: select, use: [*SUB2]}
  FBA: &FBA {type: fallback, use: [*SUB1], interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  FBL: &FBL {type: fallback, use: [*SUB2], interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  URL: &URL {type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  URLA: &URLA {type: url-test, use: [*SUB1], tolerance: 50, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  URLL: &URLL {type: url-test, use: [*SUB2], tolerance: 50, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  # ICON
  Failover: &Failover "https://raw.githubusercontent.com/s0lnce/mofish-icon/refs/heads/main/mihomo/pure/corner/failover.png"
  Auto: &Auto "https://raw.githubusercontent.com/s0lnce/mofish-icon/refs/heads/main/mihomo/pure/corner/auto.png"
  All: &All "https://raw.githubusercontent.com/s0lnce/mofish-icon/refs/heads/main/mihomo/pure/corner/all.png"
  # 规则集
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

proxy-providers:
  *SUB1: {<<: *P, url: "订阅URL", interval: 86400, override: {udp: true}}
  *SUB2: {<<: *P, url: "订阅URL", interval: 86400, override: {udp: true}}

proxies:
  - {name: 直连, type: direct, udp: true}

mixed-port: 7890
port: 8080
socks-port: 1080
redir-port: 7891
tproxy-port: 7892
authentication:
- "user:passwd"
skip-auth-prefixes:
- 127.0.0.0/8
- 192.168.0.0/16
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

geox-url:
  mmdb: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://gh-proxy.com/https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
  geosite: https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  geoip: https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat

ntp:
  enable: true
  write-to-system: true

tun:
  enable: true
  stack: mips   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  #dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip
  disable-icmp-forwarding: true
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,microsoftcn_domain,applecn_domain":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
    - https://1.1.1.1/dns-query#默认代理&disable-qtype-65=true
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  nameserver:
    - https://1.1.1.1/dns-query#默认代理&ecs=223.5.5.0/24
    - https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24
  fallback:
    - https://1.1.1.1/dns-query#默认代理
    - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain


